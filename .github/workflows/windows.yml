name: Windows build and verification
on:
  push:
    branches: ['arena/**', main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: ./tools/Invoke-Dotnet.ps1 -Log artifacts/restore.log -Command restore,SSTD.sln,--runtime,win-x64
      - name: Build
        shell: pwsh
        run: ./tools/Invoke-Dotnet.ps1 -Log artifacts/build.log -Command build,SSTD.sln,-c,Release,--no-restore
      - name: Preserve build diagnostic
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/build.log
      - name: Independent security and unit tests
        shell: pwsh
        run: ./tools/Invoke-Dotnet.ps1 -Log artifacts/unit.log -Command test,tests/SSTD.Tests/SSTD.Tests.csproj,-c,Release,--no-build,--logger,trx,--results-directory,artifacts/test-results
      - name: Preserve unit test diagnostic
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/unit.log
      - name: Publish real Windows test fixture
        shell: pwsh
        run: dotnet publish tools/SSTD.TestApp/SSTD.TestApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/test-fixture
      - name: Inspect Windows desktop session
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          "UserInteractive=$([Environment]::UserInteractive); PID=$PID; Session=$((Get-Process -Id $PID).SessionId); User=$env:USERNAME" | Tee-Object artifacts/session.log
          try { (& query.exe session 2>&1 | Out-String) | Tee-Object artifacts/session.log -Append } catch { $_ | Out-String | Tee-Object artifacts/session.log -Append }
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id,SessionId,MainWindowHandle | Out-String | Tee-Object artifacts/session.log -Append
          Get-Command PsExec64,PsExec -ErrorAction SilentlyContinue | Out-String | Tee-Object artifacts/session.log -Append
          whoami /groups | Select-String "Mandatory Label" | Out-String | Tee-Object artifacts/session.log -Append
          exit 0
      - name: Publish session diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/session.log
      - name: Real Windows UI Automation tests
        timeout-minutes: 6
        shell: pwsh
        run: ./tools/Run-DesktopTests.ps1
      - name: Preserve Windows integration diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/windows.log
      - name: Preserve desktop task diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/desktop-task.log
      - name: Preserve launcher diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/launcher.log
      - name: Publish self-contained executable
        run: dotnet publish src/SSTD.UI/SSTD.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish
      - name: Executable startup smoke test
        shell: pwsh
        run: ./tools/Run-DesktopTests.ps1 -Command "./tools/Smoke.ps1 -Exe artifacts/publish/SSTD.exe"
      - name: Preserve executable smoke diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-result.txt
      - name: Preserve executable stderr
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-error.txt
      - name: Preserve executable stderr stream
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-stderr.txt
      - name: Preserve executable smoke stage
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-stage.txt
      - name: Preserve executable smoke launch log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-launch.log
      - name: Preserve executable boot diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-boot.txt
      - name: Preserve executable unhandled diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/smoke-unhandled.txt
      - name: Package portable ZIP
        shell: pwsh
        run: ./tools/Package-Portable.ps1 -PublishDir artifacts/publish -OutputZip artifacts/SSTD-Portable.zip
      - name: Install WiX toolset
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 4.0.5
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global wix --version 4.0.5
            if ($LASTEXITCODE -ne 0) { throw 'WiX tool install failed.' }
          }
          wix extension add --global WixToolset.UI.wixext/4.0.5
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension install failed.' }
      - name: Build native MSI installer
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0]
          ./tools/Package-Msi.ps1 -PublishDir artifacts/publish -OutputMsi artifacts/SSTD-Setup.msi -Version $version
      - name: Downloaded MSI wizard smoke test
        timeout-minutes: 4
        shell: pwsh
        run: ./tools/Run-DesktopTests.ps1 -Command "./tools/Msi-InteractiveSmoke.ps1 -Msi artifacts/SSTD-Setup.msi -MarkOfTheWeb"
      - name: Preserve downloaded MSI wizard diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-motw.txt
      - name: Preserve downloaded MSI wizard log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-motw.log
      - name: Preserve downloaded MSI Windows Installer log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-motw-windows.log
      - name: MSI install, repair, and uninstall smoke test
        timeout-minutes: 5
        shell: pwsh
        run: ./tools/Run-DesktopTests.ps1 -TimeoutSeconds 300 -Command "./tools/Msi-Smoke.ps1 -Msi artifacts/SSTD-Setup.msi"
      - name: Preserve MSI smoke diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-smoke.txt
      - name: Preserve MSI install log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-install.log
      - name: Preserve MSI uninstall log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/msi-uninstall.log
      - name: Downloaded portable ZIP smoke test
        timeout-minutes: 4
        shell: pwsh
        run: ./tools/Run-DesktopTests.ps1 -Command "./tools/Portable-MotwSmoke.ps1 -Zip artifacts/SSTD-Portable.zip"
      - name: Preserve downloaded portable diagnostic
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/portable-motw.txt
      - name: Preserve downloaded portable log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/portable-motw.log
      - name: Checksums
        shell: pwsh
        run: |
          $files = @('artifacts/SSTD-Setup.msi', 'artifacts/SSTD-Portable.zip')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt
      - name: Preserve checksums
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-CiLog.ps1 -Path artifacts/SHA256SUMS.txt
      - name: Publish retrievable binary blobs
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Publish-ArtifactBlobs.ps1 -Path artifacts/SSTD-Setup.msi -Label SSTD-Setup.msi
          ./tools/Publish-ArtifactBlobs.ps1 -Path artifacts/SSTD-Portable.zip -Label SSTD-Portable.zip
          ./tools/Publish-ArtifactBlobs.ps1 -Path artifacts/SHA256SUMS.txt -Label SHA256SUMS.txt
      - name: Publish GitHub release
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version)[0]
          $tag = "v$version"
          $hash = (Get-FileHash artifacts/SSTD-Setup.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash artifacts/SSTD-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "Self-contained Windows 10/11 x64. MSI installer SHA-256: $hash. Portable ZIP SHA-256: $portableHash. 1.0.4 replaces the Inno Setup bootstrapper with a native per-user MSI to avoid the invisible SSTD-Setup.exe startup stall, keeps the portable ZIP fallback, and includes the 1.0.2 SQLite repair for tasks/messages/events/settings. Ollama is installed separately by the user."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "SSTD $version — Windows x64" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag artifacts/SSTD-Setup.msi artifacts/SSTD-Portable.zip artifacts/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSTD-windows-x64
          path: |
            artifacts/publish/SSTD.exe
            artifacts/SSTD-Setup.msi
            artifacts/SSTD-Portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/restore.log
            artifacts/build.log
            artifacts/test-results/
            artifacts/windows.log
            artifacts/smoke-result.txt
            artifacts/msi-smoke.txt
            artifacts/msi-motw.txt
            artifacts/msi-motw.log
            artifacts/msi-motw-windows.log
            artifacts/msi-install.log
            artifacts/msi-uninstall.log
            artifacts/portable-motw.txt
            artifacts/portable-motw.log
          if-no-files-found: warn
          retention-days: 14
